name: Release

on:
  release:
    types: [published]

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build_zip.sh
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/shc_nd.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
